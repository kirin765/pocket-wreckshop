<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171d22"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23edfa79'/%3E%3Cpath d='M8 4h16v9h-5v15h-6V13H8z' fill='%23171d22'/%3E%3C/svg%3E"><title>Pocket Wreckshop — One more hit.</title><style>*{box-sizing:border-box}body{margin:0;background:#101519;color:#f4f2e5;font-family:monospace;height:100dvh;display:grid;place-items:center;overflow:hidden;background-image:radial-gradient(#354048 1px,transparent 1px);background-size:24px 24px}#player{width:min(100vw,56.25dvh);height:min(100dvh,177.77778vw);position:relative;background:#171d22;box-shadow:0 0 100px #0008}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}#loading{position:absolute;inset:0;background:#171d22;display:flex;flex-direction:column;justify-content:center;padding:32px;gap:16px}h1{font-size:28px;color:#e7c58f;letter-spacing:-1px;line-height:1.15;margin:0}p{color:#a4b0ad;font-size:11px;line-height:1.7}.track{height:6px;background:#38443c}#progress{height:100%;width:0;background:#a0c7bd}#error{color:#f4a390;white-space:pre-wrap}button{background:#a0c7bd;border:0;padding:12px 20px;color:#171d22;font:700 12px monospace;cursor:pointer}#badge{position:fixed;bottom:12px;right:16px;color:#72837a;font-size:10px}@media(max-width:700px){#badge{display:none}}</style></head><body><div id="player"><canvas id="unity-canvas" width="450" height="800" tabindex="0" aria-label="Pocket Wreckshop Unity 2D game"></canvas><div id="loading"><small></small><h1>Pocket Wreckshop</h1><div class="track"><div id="progress"></div></div><p id="status">Loading the workshop…</p><p id="error" role="alert"></p></div></div><script>const canvas=document.getElementById('unity-canvas');const cfg={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,2)};const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onload=()=>createUnityInstance(canvas,cfg,p=>{document.getElementById('progress').style.width=(p*100)+'%';document.getElementById('status').textContent='Loading workshop… '+Math.round(p*100)+'%';}).then(instance=>{window.wreckshopUnity=instance;document.getElementById('loading').style.display='none';canvas.focus();}).catch(error=>{document.getElementById('error').textContent='Could not open the workshop. '+error;document.getElementById('status').textContent='Please reload to try again.';});script.onerror=()=>document.getElementById('error').textContent='Could not download the Unity loader. Please reload.';document.body.appendChild(script);</script></body></html>
